[package]
name = "herdr-sidebar"
description = "Herdr plugin: a workspace and agents tree with CPU and memory in the Agents panel, and the totals in the tab bar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
herdr-api = { path = "../crates/herdr-api" }
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
