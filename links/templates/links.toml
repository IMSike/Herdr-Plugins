# Réglages des liens (imsike.links) : ce que fait un ctrl+clic sur un chemin que
# dx (le plugin Claude Code) a rendu cliquable. Une ligne commentée garde sa valeur
# par défaut. Chaque clic relit ce fichier ; l'entrée Settings du menu les règle.
# Un dossier est toujours sélectionné dans l'Explorateur de fichiers.

# Un fichier : "preview" (l'aperçu de herdr-explorer ; sans lui, comme
# "application"), "select" (sélectionné dans l'Explorateur, pas ouvert avec son
# programme) ou "application" (le programme que Windows lui associe, pour les
# types ci-dessous).
# file = "preview"

# Types (sans le point, casse indifférente) que l'application par défaut peut
# ouvrir : aucun ne lance de code par lui-même (le programme qui l'ouvre peut
# toujours avoir des failles), sauf un pdf, dont le lecteur (Acrobat, celui
# d'Edge) peut exécuter le JavaScript qu'il contient, dans son bac à sable. Un
# fichier d'un autre type est sélectionné dans l'Explorateur, sauf avec
# run_programs. Toute extension peut être ajoutée, avec ou sans son point ;
# seule la dernière compte (gz, pas tar.gz). Un type qui contient une espace,
# un caractère qu'aucun nom de lien ne peut porter (\ / : * ? " < > | , ; %, un
# caractère de contrôle, invisible, à usage privé ou braille vide, un
# non-caractère Unicode) ou qui finit par un point est laissé de côté.
# open_types = ["txt", "md", "markdown", "rst", "adoc", "log", "pdf", "docx", "xlsx", "pptx", "csv", "tsv", "json", "jsonc", "json5", "jsonl", "yaml", "yml", "toml", "ini", "cfg", "conf", "env", "properties", "lock", "sql", "diff", "patch", "c", "h", "cc", "cpp", "cxx", "hpp", "cs", "go", "rs", "java", "kt", "swift", "ts", "tsx", "jsx", "vue", "svelte", "css", "scss", "sass", "less", "png", "jpg", "jpeg", "gif", "bmp", "webp", "ico", "tif", "tiff", "avif", "heic", "mp3", "wav", "flac", "ogg", "m4a", "mp4", "mkv", "webm", "mov", "avi"]

# ── Danger ──────────────────────────────────────────────────────────────────
# Un lien peut venir de n'importe où : Claude peut écrire un lien vers n'importe
# quel fichier, sous n'importe quel texte, et tout programme d'un pane peut en
# afficher un.

# DANGER : un fichier d'un autre type s'ouvre aussi avec son programme ; un
# programme, un script ou un installeur se lance. Laisser à false sauf besoin.
# run_programs = false

# Avec run_programs : une fenêtre montre le vrai chemin du fichier et attend
# Entrée avant de l'ouvrir (Échap annule).
# confirm_programs = true
