[workspace]
resolver = "3"
members = ["crates/herdr-api", "menu", "sidebar"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/IMSike/Herdr-Plugins"
publish = false

# Versions shared by the crates; each one picks its own features.
[workspace.dependencies]
herdr-api = { path = "crates/herdr-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40.1", default-features = false }
# Settings files: read with toml, written by the menu with toml_edit, which keeps their comments.
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

[profile.release]
lto = "thin"
strip = true
