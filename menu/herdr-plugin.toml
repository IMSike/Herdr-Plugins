id = "imsike.menu"
name = "Menu"
version = "0.0.0"
min_herdr_version = "0.9.5"
description = "A menu that opens a tool (lazygit, gh-dash…) in a large popup, updates Herdr and the plugins, sets the plugins: a Tools pane of icons above the file explorer, or a popup"
platforms = ["linux", "windows"]

# The release binary of the commit installed, into target/release/; built
# with cargo when that commit has no release (docs/en/adr/0008-prebuilt-binaries.md).
[[build]]
platforms = ["linux"]
command = ["sh", "../scripts/fetch-bin.sh", "herdr-menu"]

[[build]]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "../scripts/fetch-bin.ps1", "herdr-menu"]

# Closes the Tools panes restored as plain shells after a restart, then checks
# whether Herdr or a plugin installed from GitHub has a new version.
[[startup]]
command = ["target/release/herdr-menu", "startup"]

[[actions]]
id = "open"
title = "Open the menu"
contexts = ["workspace"]
command = ["target/release/herdr-menu", "open"]

[[panes]]
id = "menu"
title = "Menu"
placement = "popup"
width = 44
height = 14
command = ["target/release/herdr-menu", "menu"]

[[panes]]
id = "run"
title = "Tool"
placement = "popup"
width = "95%"
height = "95%"
command = ["target/release/herdr-menu", "run"]

[[panes]]
id = "settings"
title = "Settings"
placement = "popup"
width = "70%"
height = "80%"
command = ["target/release/herdr-menu", "settings"]

# A terminal editor on the configuration files, opened by the settings screen.
[[panes]]
id = "edit"
title = "Settings files"
placement = "tab"
command = ["target/release/herdr-menu", "edit"]

[[panes]]
id = "bar"
title = "Tools"
placement = "split"
command = ["target/release/herdr-menu", "bar"]

# The Tools pane opens with the explorer and closes as soon as it loses its place.
[[events]]
on = "pane.created"
command = ["target/release/herdr-menu", "pane-created"]

[[events]]
on = "pane.closed"
command = ["target/release/herdr-menu", "pane-closed"]
