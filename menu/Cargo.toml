[package]
name = "herdr-menu"
description = "Herdr plugin: a menu that opens a tool (lazygit, gh-dash…) in a large popup, updates Herdr and the plugins, sets the plugins, recovers a session from Herdr's snapshots: a Tools pane of icons above the file explorer, or a popup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
crossterm = { workspace = true, features = ["events", "windows"] }
serde.workspace = true
serde_json.workspace = true
herdr-api.workspace = true
toml.workspace = true
toml_edit.workspace = true
sysinfo = { workspace = true, features = ["disk"] }
unicode-width.workspace = true
# Local time, for the dates of the session snapshots.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
herdr-api = { workspace = true, features = ["test-support"] }
