[package]
name = "herdr-menu"
description = "Herdr plugin: a menu (a Tools pane above the file explorer, or a popup) that opens a tool (lazygit, gh-dash…) in a large popup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
herdr-api = { path = "../crates/herdr-api" }
toml = "1"
sysinfo = { version = "0.40.1", default-features = false, features = ["disk", "system"] }
