[package]
name = "herdr-menu"
description = "Herdr plugin: a menu that opens a tool (lazygit, gh-dash…) in a large popup, updates Herdr and sets the plugins: a Tools pane of icons above the file explorer, or a popup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
serde.workspace = true
serde_json.workspace = true
herdr-api.workspace = true
toml.workspace = true
toml_edit.workspace = true
sysinfo = { workspace = true, features = ["disk", "system"] }
unicode-width = { version = "0.2.3", default-features = false }
