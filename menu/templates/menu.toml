# Réglages du menu (imsike.menu). Une ligne commentée garde sa valeur par défaut.
# L'entrée Settings du menu règle les premiers ; le pane Tools relit ce fichier
# quand il change.

# 2,4G plutôt que 2.4G.
# decimal_comma = true

# 4 % plutôt que 4%.
# percent_space = false

# CPU avec une décimale : 4,2% plutôt que 4%.
# cpu_decimal = false

# Unités de la mémoire : "M" (853M, 2,4G), "Mo" (853Mo, 2,4Go) ou "MB" (853MB).
# memory_unit = "M"

# Espace (fine, insécable) avant l'unité : 2,4 Go plutôt que 2,4Go.
# memory_space = false

# Totaux CPU / mémoire du pane Tools : "line" (une ligne) ou "bars" (quatre
# lignes : CPU, RAM, puis ceux de la machine, chacun avec une barre en dégradé
# selon ses seuils, réglés dans sidebar.toml).
# totals = "line"

# Entrées du menu. Sans aucune entrée, le menu garde les siennes : lazygit (l),
# gh-dash (g), btop (b), VS Code (c), Disk (d), Update (u) et Settings (s).
# Dès qu'une entrée est écrite ici, elle remplace toute la liste.
#
# [[entries]]
# key = "l"                 # touche qui ouvre l'entrée
# label = "lazygit"
# command = ["lazygit"]     # programme et arguments, sans shell
# cwd = "workspace"         # ou "pane" : dossier du pane actif (depuis le pane Tools, du premier terminal de l'onglet)
# icon = "󰊢"                # glyphe Nerd Font ; sa touche sans icône
# popup = true              # false : programme qui ouvre sa propre fenêtre
#
# [[entries]]
# key = "u"
# label = "Update"
# action = "update"         # ou "settings", "disk" : entrées intégrées, à la place de command
