name: Plugins

# Checks formatting, lints and runs the tests of every plugin of the Cargo
# workspace, on Linux and Windows, and checks that it compiles with the
# oldest Rust it declares. See CONTRIBUTING.md.

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it replaces.
concurrency:
  group: plugins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Dependencies built by an earlier run, per system.
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

  # The oldest Rust the workspace declares (rust-version), which a user's
  # machine may have when Herdr builds a plugin on install; on both systems,
  # since some code is built only on Windows.
  minimum-rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust 1.89
        run: rustup toolchain install 1.89 --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-1.89

      - name: Compile check
        run: cargo +1.89 check --locked --all-targets
