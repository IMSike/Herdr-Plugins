name: Plugins

# Checks formatting, lints and runs the tests of every plugin of the Cargo
# workspace, on Linux and Windows, and builds it with the oldest Rust it
# declares. See CONTRIBUTING.md.

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

  # The oldest Rust the workspace declares (rust-version), which a user's
  # machine may have when Herdr builds a plugin on install.
  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust 1.88
        run: rustup toolchain install 1.88 --profile minimal

      - name: Build
        run: cargo +1.88 check --locked --all-targets
